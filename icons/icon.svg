<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners for maskable icon support -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Decorative Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#334155" stroke-width="12"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#accent)" stroke-width="12" stroke-dasharray="280 850" stroke-linecap="round"/>
  <!-- Text / Logo -->
  <text x="256" y="240" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="96" fill="#ffffff" text-anchor="middle" letter-spacing="4">AGM</text>
  <text x="256" y="320" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="48" fill="#38bdf8" text-anchor="middle" letter-spacing="8">FIT</text>
</svg>
